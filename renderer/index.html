<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>AGA — Aurora Gate Allocator</title>
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="../build/icon.png" />
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-title">
      AGA — Aurora Gate Allocator
    </div>
    <div class="titlebar-controls">
      <div class="update-wrap">
        <button class="win-btn" id="btn-update" title="Mises a jour">
          <svg viewBox="0 0 16 16"><path d="M8 2v8M4.5 6.5L8 10l3.5-3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 13h10" stroke-linecap="round"/></svg>
          <span class="update-dot" id="update-dot"></span>
        </button>
        <div class="update-panel hidden" id="update-panel">
          <div class="update-row">
            <span class="field-label">Version</span>
            <span class="data" id="update-version">-</span>
          </div>
          <div class="update-row">
            <span class="field-label">Canal</span>
            <select class="field code" id="update-channel">
              <option value="latest">Stable</option>
              <option value="beta">Beta</option>
            </select>
          </div>
          <div class="update-status" id="update-status">-</div>
          <div class="update-actions">
            <button class="btn btn-ghost" id="update-check">Verifier</button>
            <button class="btn btn-accent hidden" id="update-download">Telecharger</button>
            <button class="btn btn-accent hidden" id="update-install">Redemarrer et installer</button>
          </div>
        </div>
      </div>
      <button class="win-btn" id="btn-debug" title="Fenetre debug">
        <svg viewBox="0 0 16 16"><path d="M2 3h12M2 8h12M2 13h8" stroke-linecap="round"/></svg>
      </button>
      <button class="win-btn" id="btn-pin" title="Epingler au premier plan">
        <svg viewBox="0 0 16 16"><path d="M8 2v5l3 3H5l3-3z"/><path d="M8 10v4"/></svg>
      </button>
      <button class="win-btn" id="btn-minimize" title="Reduire">
        <svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg>
      </button>
      <button class="win-btn" id="btn-maximize" title="Agrandir">
        <svg viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9"/></svg>
      </button>
      <button class="win-btn win-close" id="btn-close" title="Fermer">
        <svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13"/></svg>
      </button>
    </div>
  </div>

  <div class="toolbar">
    <span class="field-label">Terrain</span>
    <select class="field code" id="select-airport"></select>
    <span class="field-label">Hote</span>
    <input class="field host" id="input-host" value="127.0.0.1" />
    <span class="field-label">Port</span>
    <input class="field port" id="input-port" value="1130" />
    <button class="btn btn-accent" id="btn-connect">Connecter</button>
    <button class="btn btn-ghost" id="btn-disconnect" disabled>Deconnecter</button>
    <div class="spacer"></div>
    <div class="status">
      <span class="dot" id="status-dot"></span>
      <span id="status-label">Deconnecte</span>
    </div>
  </div>

  <div class="columns">
    <div class="column">
      <div class="column-header">
        <span class="column-title">Pending — en approche</span>
        <span class="count" id="count-pending">0</span>
      </div>
      <div class="column-body" id="col-pending"></div>
    </div>
    <div class="column">
      <div class="column-header">
        <span class="column-title">Roulage — porte assignee</span>
        <span class="count" id="count-taxi">0</span>
      </div>
      <div class="column-body" id="col-taxi"></div>
    </div>
    <div class="column">
      <div class="column-header">
        <span class="column-title">Stationnes</span>
        <span class="count" id="count-parked">0</span>
      </div>
      <div class="column-body" id="col-parked"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
