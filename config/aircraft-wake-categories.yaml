# Reference generique (non liee a un aeroport) : categorie de voilure OACI
# (code lettre, base sur l'envergure) par type d'aeronef ICAO.
#
#   A < 15 m | B 15-24 m | C 24-36 m | D 36-52 m | E 52-65 m | F 65-80 m
#
# Valeurs basees sur les envergures publiques constructeur / ICAO Doc 8643.
# Liste non exhaustive : a completer au fur et a mesure des types rencontres
# dans le trafic (type ICAO absent => l'engine doit le signaler, pas deviner).

aircraft:
  # Airbus A220 / A320 family
  BCS1: C
  BCS3: C
  A318: C
  A319: C
  A320: C
  A321: C
  A19N: C
  A20N: C
  A21N: C

