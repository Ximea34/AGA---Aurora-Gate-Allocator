# Configuration moteur d'allocation - Paris Charles de Gaulle (LFPG)
#
# Sources :
#   - GATES/lfpg.gts (coordonnees + 5e champ G/M/H/S = categorie de voilure,
#     fourni par l'utilisateur)
#   - AIP France AD 2 LFPG (eAIP, AMDT en vigueur a la generation) : ARP
#     (AD 2 LFPG.2), cartes AD 2 LFPG APDC 01-05 (postes de stationnement,
#     lues visuellement pour etablir la correspondance prefixe de poste <->
#     zone du tableau compagnies)
#   - LFPG-Affectation compagnies.pdf (document IVAO France specifique a LFPG,
#     mise a jour 30/06/2025) : tableau exhaustif compagnie -> zone(s)
#   - MANEX Aeroports Civils IVAO LFPG (wiki.ivao.fr) : description generale
#     des terminaux, postes A380, zone Juliett/Kilo/Lima non commerciale
#
# LIMITES CONNUES (a completer/verifier) :
#   - Categorie de voilure : le 5e champ du .gts (G/M/H/S) a ete interprete
#     comme G=Light(B), M=Medium(C), H=Heavy(E), S=Super/A380(F), confirme
#     par recoupement avec les postes A380 explicitement cites par le MANEX
#     (CFE, CFW, K05, K13, K53, K59, K65, K71 -> tous "S"). Plus fiable que
#     l'approximation qualitative utilisee pour LFPO, mais reste une
#     interpretation non confirmee par ADP/le SIA directement.
#   - Zone "3" (Terminal 3, bus-gate) : AUCUN prefixe de poste physique
#     identifie avec certitude - les compagnies qui y sont affectees dans le
#     tableau (AIZ/Arkia, ENT, EXS, FEG, FPO pax, IBS, ISR, LBT, MAC, MSC,
#     NBT, NIA, PGT, SXS, TSC, TVS, UAL, VLG, VOE) ne sont PAS assignees a un
#     groupe ici. A completer si la carte APDC correspondante est identifiee.
#   - Zone "FedEx" du tableau compagnies supposee correspondre a l'aire
#     "India" (prefixe I numerique simple, hors I3*/I4* qui sont les
#     satellites 2ES3/2ES4 confirmes visuellement) - deduction par
#     l'alphabet phonetique (India=I), pas confirmee par une carte.
#   - Zones "R" et "S" (colonnes distinctes du tableau compagnies, hors
#     Satellite S3/S4) mappees aux prefixes R*/S* par simple correspondance
#     de lettre - non confirme visuellement sur une carte APDC.
#   - Postes Juliett/Kilo/Lima (J*/K*/L*) fermes (stockage/overflow non
#     commercial d'apres le MANEX) - cela inclut aussi les vrais postes A380
#     K05/K13/K53/K59/K65/K71 : ils ne seront donc jamais suggeres tant que
#     cette zone reste fermee. A revoir si ces postes gros-porteurs doivent
#     etre ouverts.
#   - ~130 postes (prefixes EN*, Q*, T*, U*hors-UW, etc.) sans
#     groupe de compagnie identifie - ouverts a toute compagnie, filtres par
#     categorie de voilure uniquement.
#   - Aucune donnee de blocage de voisinage (gate_blocking) trouvee pour
#     LFPG - omis.

