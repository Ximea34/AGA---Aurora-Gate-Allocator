# Postes qui se neutralisent mutuellement : si un poste du groupe est occupe,
# les autres postes du meme groupe sont consideres indisponibles (gros porteur
# empietant sur les postes voisins).
# Blocage par PAIRE ADJACENTE uniquement (pas de clique sur tout le groupe) :
# occuper un poste ne bloque que son(ses) voisin(s) immediat(s) dans la
# liste, pas les postes "de l'autre cote". Ex: B82 occupe bloque B81 ET B83,
# mais B81 occupe ne bloque que B82 (pas B83).
gate_blocking_pairs:
  - [C81, C82]
  - [C82, C83]
  - [D21, D22]
  - [D22, D23]
  - [D41, D42]
  - [D42, D43]
  - [C21, C22]
  - [C22, C23]
  - [C41, C42]
  - [C42, C43]
  - [C61, C62]
  - [C62, C63]
  - [B61, B62]
  - [B62, B63]
  - [B71, B72]
  - [B72, B73]
  - [B81, B82]
  - [B82, B83]
  - [B91, B92]
  - [B92, B93]
  - [M11, M12]
  - [M12, M13]

# Groupes de postes avec une regle de compagnie commune. Un groupe sans
# "airlines" (ou liste vide) est ouvert a toute compagnie (filtre uniquement
# par categorie de voilure).
#
# Le code compagnie correspond au prefixe de callsign tel que recu du
# connecteur Aurora (ex: callsign "AFR275" -> prefixe "AFR").
gate_groups:
  terminal1_c:
    label: Terminal 1 - postes C (hors C82 et hors C81/C83)
    gates: [C19, C21, C22, C23, C41, C42, C43, C61, C62, C63]
    airlines: [AFR, CCM, AUA, ENT, KLM, CLG]
    # AFR=Air France, CCM=Air Corsica, AUA=Austrian, ENT=Enter Air
    # (suppose "Ent Air" = Enter Air, a confirmer), KLM=KLM,
    # CLG=Chalair (code a confirmer)

  terminal1_d:
    label: Terminal 1 - postes D et C81/C83 (hors C82/D22)
    gates: [D21, D23, D41, D42, D43, D61, D63, C81, C83]
    airlines: [DAH, BAW, BEL, IBE, DLH, TAR, THY]
    # DAH=Air Algerie, BAW=British Airways, BEL=Brussels Airlines
    # (confirme par trafic reel BEL3580 -> EBBR), IBE=Iberia,
    # DLH=Lufthansa, TAR=Tunisair, THY=Turkish Airlines
    # Nouvelair volontairement omis : code ICAO non confirme avec certitude

  terminal1_heavy:
    label: Terminal 1 - gros porteurs (C82/D22)
    gates: [C82, D22]
    airlines: [ACA, UAE, QTR]
    # ACA=Air Canada, UAE=Emirates, QTR=Qatar Airways

  cargo:
    label: Cargo (pas de compagnie passagers)
    gates: [J11, J13, J14, J15, J19]
    airlines: []

  general_aviation:
    label: Aviation generale (Parking G)
    gates: [G11, G12, G13, G14, G15, G16]
    airlines: []

  # NON RESOLU : la doc source (LFLL_compagnies_terminal_porte.txt) mentionne
  # "Terminal 2 - tous postes" et "Terminal 3 - tous postes" pour ces
