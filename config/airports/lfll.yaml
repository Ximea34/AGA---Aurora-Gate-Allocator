# Configuration moteur d'allocation - Lyon Saint-Exupery (LFLL)
#
# Sources :
#   - GATES/lfll.gts                         (coordonnees des postes)
#   - GATES/GATE_WAKE.txt                     (categorie OACI max par poste, AIP France AD 2 LFLL MIA TEXT 01-04)
#   - GATES/LFLL_compagnies_terminal_porte.txt (attribution compagnies par terminal, MANEX Aeroports Civils IVAO)
#
# Priorite des criteres d'attribution : compagnie > categorie de voilure (wake).

icao: LFLL
name: Lyon Saint-Exupery

# Point de reference aerodrome (ARP), utilise pour detecter les trafics en
# finale (rayon + altitude, cf. final_approach_criteria).
reference_point:
  lat: N045.43.32.000
  lon: E005.04.52.000

# Criteres de detection "trafic en finale" declenchant la proposition de
# porte au controleur.
final_approach_criteria:
  radius_nm: 20 # TEMPORAIRE (test) - valeur normale : 3
  max_altitude_ft: 7000 # TEMPORAIRE (test) - valeur normale : 2000

