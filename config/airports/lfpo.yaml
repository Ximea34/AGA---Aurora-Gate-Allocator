# Groupes de postes avec une regle de compagnie commune (prefixe de
# callsign tel que recu du connecteur Aurora). Un groupe sans "airlines"
# est ouvert a toute compagnie (filtre wake uniquement) - postes distants
# (Mike/Novembre/Quebec/Echo/Fox/Golf) et Hotel/protocole.
gate_groups:
  zone_papa:
    label: Zone 1A - Papa
    gates: [P08, P09, P10, P11, P12, P13, P14, P41, P42]
    airlines: [DLA, AEA, AEH, AIA, CLG, IBE, TJT, VOE, VLG]
    # DLA=Air Dolomiti, AEA=Air Europa, AEH/AIA=Amelia, CLG=Chalair,
    # IBE=Iberia, TJT=Twin Jet, VOE=Volotea, VLG=Vueling (vols Schengen)

  zone_1b:
    label: Zone 1B - Romeo/Sierra/Tango (T26-T29)
    gates: [R01, R22, S04, S24, S25, S26, T26, T27, T28, T29]
    airlines: [EJU, EZS, TAP, WMT, WZZ]
    # EJU/EZS=easyJet (Schengen), TAP=TAP Air Portugal, WMT/WZZ=Wizzair

  zone_2c:
    label: Zone 2C - Tango (T30-T32)/Uniform/Victor
    gates: [T30, T31, T32, U03, U04, U05, V06, V07]
    airlines: [CCM, AFR, AMC, ITA]
    # CCM=Air Corsica, AFR=Air France (vols domestiques), AMC=Air Malta,
    # ITA=ITA Airways

  zone_alpha:
    label: Zone 3D/3E - Alpha (postes partages non-Schengen/Schengen)
    gates: [A01, A02, A03, A04, A05, A11, A12, A21, A22, A31, A32, A41, A42, A51, A52]
    airlines: [AFR, AZU, EZY, TVF, JAF, VLG, TRA]
    # 3D (non-Schengen): AFR, AZU=Azul, EZY=easyJet, TVF=Transavia France,
    # JAF=TUI fly Belgium, VLG=Vueling
    # 3E (Schengen, memes postes): TVF, TRA=Transavia Holland

  zone_delta:
    label: Zone 4E - Delta
    gates: [D01, D02, D04, D06, D11, D12]
    airlines: [TVF, TRA]

  zone_4f:
    label: Zone 4F - Charlie/Bravo
    gates: [C01, C02, C03, C06, C08, B01, B02, B03, B04, B05, B12, B21, B22, B31, B32, B41, B42, B51, B52, B61, B62]
    airlines: [CAJ, FWI, DAH, CRL, FBU, DJT, RAM, TVF, TAR]
    # CAJ/FWI=Air Caraibes, DAH=Air Algerie, CRL=Corsair, FBU=French bee,
    # DJT=La Compagnie, RAM=Royal Air Maroc, TVF=Transavia France,
    # TAR=Tunisair

