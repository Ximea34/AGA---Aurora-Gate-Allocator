# Configuration moteur d'allocation - Paris Orly (LFPO)
#
# Sources :
#   - GATES/lfpo.gts                    (coordonnees des postes, fournies par l'utilisateur)
#   - AIP France AD 2 LFPO (eAIP 09 JUL 2026) : ARP (AD 2 LFPO.2), contraintes
#     de postes (AD 2 LFPO.20.8.3)
#   - MANEX Aeroports Civils IVAO - LFPO Paris Orly (wiki.ivao.fr) : zones,
#     compagnies par terminal, postes gros porteurs
#
# Priorite des criteres d'attribution : compagnie > categorie de voilure (wake).
#
# LIMITES CONNUES (a completer/verifier) :
#   - Pas de table envergure-max par poste publique (l'AIP renvoie vers
#     l'extranet operationnel ADP, non accessible). Categories deduites du
#     texte qualitatif du MANEX : C par defaut (familles B737/A320), E pour
#     les postes "Contact"/"Large" gros porteurs listes explicitement, F
#     pour N25/N55 (A380). A verifier/affiner si une source precise est
#     trouvee (comme GATE_WAKE.txt pour LFLL).
#   - Le champ 5 (H/M/S/L) de GATES/lfpo.gts n'est PAS utilise ici : sa
#     signification exacte est incertaine (une legende de carte SIA associe
#     "H" a "poste utilisable par des helicopteres", ce qui ne correspond
#     pas a la majorite des postes marques H dans le fichier - a clarifier
#     avant de s'en servir).
#   - Les zones 3D (Alpha, vols non-Schengen) et 3E (Alpha, vols Schengen)
#     partagent les MEMES postes physiques (serie A) mais avec des
#     compagnies differentes selon le type de vol (Schengen/non-Schengen) -
#     notre modele ne gere qu'une seule liste de compagnies par poste, donc
#     les deux listes ont ete fusionnees (union) pour le groupe Alpha.
#   - Aucune donnee source sur des postes qui se neutralisent mutuellement
#     (contrairement a LFLL) - gate_blocking absent, a completer si trouve.

icao: LFPO
name: Paris Orly

reference_point:
  lat: N048.43.24.000
  lon: E002.22.46.000

final_approach_criteria:
  radius_nm: 3
  max_altitude_ft: 2000

# Postes Juliet : non utilises pour les vols commerciaux (stationnement
# longue duree uniquement, cf MANEX §3.1.3).
closed_gates:
  - J01
  - J02
  - J21
  - J22

# Categorie OACI max (envergure) par poste. Lettre = code lettre OACI :
#   A < 15 m | B 15-24 m | C 24-36 m | D 36-52 m | E 52-65 m | F 65-80 m
# Par defaut C (familles B737/A320 max, majorite des postes). Postes
